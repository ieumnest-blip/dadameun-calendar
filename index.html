<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>다담은, 달력</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%2285%22>☁️</text></svg>">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: #eef2f5;
    color: #33505f;
    overscroll-behavior-y: none;
  }

  /* ===== 클라우드 동기화 오버레이 ===== */
  .sync-overlay {
    position: fixed; inset: 0;
    background: #eef2f5;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }
  .sync-overlay.hidden { display: none; }
  .sync-overlay .sync-emoji { font-size: 36px; }
  .sync-overlay .sync-text { font-size: 14px; color: #33546b; font-weight: 700; }

  /* ===== 비밀번호 잠금 화면 ===== */
  .pw-gate {
    position: fixed; inset: 0;
    background: #eef2f5;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pw-gate.hidden { display: none; }
  .pw-box {
    background: #fff;
    border-radius: 20px;
    padding: 32px 26px;
    width: 260px;
    box-sizing: border-box;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    text-align: center;
  }
  .pw-icon { font-size: 36px; margin-bottom: 6px; }
  .pw-title {
    font-size: 15px;
    color: #33546b;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .pw-box input {
    font-family: inherit;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #c7d6de;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 10px;
    background: #f5f8fa;
    text-align: center;
  }
  .pw-error {
    color: #e06565;
    font-size: 12.5px;
    min-height: 16px;
    margin-bottom: 8px;
  }
  .pw-box button {
    font-family: inherit;
    width: 100%;
    background: #3d8fc0;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .pw-box button#pwSignup {
    background: none;
    color: #4a7a92;
    font-weight: 400;
    font-size: 12.5px;
    text-decoration: underline;
    margin-top: 8px;
    padding: 4px 0;
  }
  .pw-divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 10px;
    color: #9fb8c4;
    font-size: 11.5px;
  }
  .pw-divider::before,
  .pw-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #dbe4ea;
  }
  .pw-google-btn {
    background: #fff !important;
    color: #33505f !important;
    border: 1px solid #dbe4ea !important;
    font-weight: 600 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .lock-btn {
    font-family: inherit;
    border: none;
    background: #dbe4ea;
    color: #33546b;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* ===== 상단바 (한 줄) ===== */
  header {
    position: sticky; top: 0; z-index: 20;
    background: #eef2f5;
    border-bottom: 2px dashed #c7d6de;
    padding: 10px 10px 12px;
  }
  .top-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    max-width: 480px;
    margin: 0 auto;
  }
  .left-group {
    display: flex;
    align-items: center;
    min-width: 0;
    height: 100%;
  }
  .left-group .account-picker {
    margin: 0 auto;
  }
  .month-nav { justify-self: center; }
  .right-group {
    display: flex;
    align-items: center;
    gap: 4px;
    justify-self: end;
  }
  @media (min-width: 680px) {
    .top-row { max-width: 720px; }
  }
  @media (min-width: 1100px) {
    .top-row { max-width: 1700px; }
  }
  .logo {
    display: flex;
    align-items: baseline;
    gap: 4px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .logo .stamp {
    display: inline-block;
    background: #3d8fc0;
    color: #fff;
    font-size: 12px;
    padding: 3px 7px 2px;
    border-radius: 7px;
    transform: rotate(-6deg);
  }
  .logo .txt {
    font-size: 17px;
    letter-spacing: 0.5px;
  }
  .logo .txt b { color: #1f7bb5; }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .month-nav button {
    font-family: inherit;
    position: relative;
    border: none; background: #dbe4ea; color: #33546b;
    width: 46px; height: 34px; border-radius: 50% 50% 50% 50% / 60% 60% 60% 60%;
    font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 5px rgba(79,176,224,0.25);
  }
  .month-nav button::before,
  .month-nav button::after {
    content: '';
    position: absolute;
    background: #dbe4ea;
    border-radius: 50%;
  }
  .month-nav button::before {
    width: 22px; height: 22px;
    top: -11px; left: 6px;
  }
  .month-nav button::after {
    width: 17px; height: 17px;
    top: -7px; right: 5px;
  }
  .month-nav .label {
    font-size: 19px;
    font-weight: 700;
    flex: 1;
    min-width: 76px;
    text-align: center;
    color: #1f7bb5;
    cursor: pointer;
    border-bottom: 1px dashed #6fb3dd;
    padding-bottom: 2px;
  }
  .view-toggle {
    font-family: inherit;
    border: none;
    background: #33505f;
    color: #fff;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .account-picker {
    display: flex;
    flex-direction: row;
    gap: 4px;
    flex-shrink: 0;
  }
  .acc-card {
    font-family: inherit;
    background: none;
    border: none;
    box-shadow: none;
    padding: 3px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .acc-card .acc-emoji { font-size: 19px; }
  .acc-card .acc-name {
    display: none;
  }
  .acc-card.active {
    background: #dbe4ea;
  }

  /* ===== 월 선택 팝업 ===== */
  .picker-year-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; margin-bottom: 12px;
  }
  .picker-year-nav button {
    font-family: inherit;
    border: none; background: #dbe4ea; color: #33505f;
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 15px; cursor: pointer;
  }
  .picker-year-nav span { font-size: 16px; color: #1f7bb5; }
  .picker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .picker-grid button {
    font-family: inherit;
    border: 1px solid #c7d6de;
    background: #f5f8fa;
    color: #33505f;
    border-radius: 10px;
    padding: 10px 0;
    font-size: 14px;
    cursor: pointer;
  }
  .picker-grid button.active {
    background: #3d8fc0;
    border-color: #3d8fc0;
    color: #fff;
  }

  /* ===== 1년 전체보기 ===== */
  .year-overview {
    display: none;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .year-overview.show { display: grid; }
  #calendarWrap.hidden { display: none; }
  @media (min-width: 680px) {
    .year-overview {
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
    }
  }

  .mini-month {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    padding: 8px 5px 6px;
    cursor: pointer;
  }
  .mini-month .mini-title {
    text-align: center;
    font-size: 13px;
    color: #1f7bb5;
    margin-bottom: 3px;
  }
  .mini-month table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .mini-month th {
    font-size: 8px; font-weight: normal; color: #bbb; padding-bottom: 2px;
  }
  .mini-month th.sun { color: #e8a3a3; }
  .mini-month th.sat { color: #a3c0e8; }
  .mini-month td {
    font-size: 9px; text-align: center; padding: 1.5px 0; position: relative;
  }
  .mini-month td.sun-cell { color: #e06565; }
  .mini-month td.sat-cell { color: #5b8ee0; }
  .mini-month td.holiday { color: #e06565; }
  .mini-month td.mini-today {
    color: #fff;
  }
  .mini-month td.mini-today span {
    background: #3d8fc0;
    border-radius: 50%;
    display: inline-block;
    width: 14px; height: 14px; line-height: 14px;
  }
  .mini-spacer { visibility: hidden; }
  .mini-dot {
    width: 3px; height: 3px; border-radius: 50%;
    background: #3fa0d8;
    margin: 1px auto 0;
  }
  .mini-dot-range { background: #e0a82c; }

  /* ===== 본문 (좌우로 넘기는 월별 달력) ===== */
  main {
    padding: 12px 10px 235px;
    max-width: 480px;
    margin: 0 auto;
  }
  #calendarWrap {
    display: flex;
    flex-wrap: nowrap;
    align-items: flex-start;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    gap: 16px;
    padding-bottom: 14px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #9fd0ec transparent;
    transform: scaleY(-1);
  }
  #calendarWrap > * {
    transform: scaleY(-1);
  }
  #calendarWrap::-webkit-scrollbar {
    height: 7px;
  }
  #calendarWrap::-webkit-scrollbar-track {
    background: #eef2f5;
    border-radius: 4px;
  }
  #calendarWrap::-webkit-scrollbar-thumb {
    background: #9fd0ec;
    border-radius: 4px;
  }
  @media (min-width: 680px) {
    main { max-width: 720px; }
  }

  .month-block {
    flex: 0 0 100%;
    scroll-snap-align: start;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 14px 8px 16px;
    box-sizing: border-box;
    min-height: calc(6 * max(58px, calc((100vh - 330px) / 6)) + 85px);
  }
  .month-title {
    text-align: center;
    font-size: 18px;
    margin: 2px 0 10px;
    color: #1f7bb5;
  }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th {
    font-size: 12px; font-weight: normal;
    color: #999; padding-bottom: 6px;
  }
  th.sun { color: #e06565; }
  th.sat { color: #5b8ee0; }

  td {
    text-align: center;
    vertical-align: top;
    padding: 3px 2px;
    height: max(58px, calc((100vh - 330px) / 6));
    font-size: 14px;
    position: relative;
    cursor: pointer;
    border-radius: 10px;
  }
  td.empty { cursor: default; }
  td.drag-selected { background: rgba(61,143,192,0.18); }
  td.sun-cell .day-num { color: #e06565; }
  td.sat-cell .day-num { color: #5b8ee0; }
  td.holiday .day-num { color: #e06565; }
  .holiday-name {
    font-size: 11.5px;
    font-weight: 600;
    color: #e06565;
    margin-top: 1px;
    line-height: 1.15;
    padding: 0 1px;
    text-align: center;
    white-space: normal;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .holiday-alt-label {
    position: absolute;
    left: 50%;
    top: -18px;
    transform: translateX(-50%);
    font-size: 12.5px;
    font-weight: 600;
    color: #e06565;
    white-space: nowrap;
    text-align: center;
    line-height: 1;
    z-index: 4;
    pointer-events: none;
  }
  .holiday-alt-arrow {
    display: block;
    font-size: 13px;
    line-height: 0.7;
    margin-top: 1px;
  }
  td:active:not(.empty) { background: #e2f3fb; }

  .day-num {
    display: inline-block;
    width: 24px; height: 24px; line-height: 24px;
    position: relative;
  }
  td.today .day-num {
    background: #3d8fc0;
    color: #fff;
    border-radius: 50%;
  }
  /* 메모가 있는 날 - 손글씨 동그라미 */
  td.has-memo .day-num::after {
    content: '';
    position: absolute;
    top: -3px; left: -3px; right: -3px; bottom: -3px;
    border: 2px solid var(--memo-color, #3fa0d8);
    border-radius: 55% 45% 52% 48% / 48% 55% 45% 52%;
    transform: rotate(-4deg);
  }
  td.today.has-memo .day-num::after {
    border-color: #fff;
  }

  /* 기간 등록 - 형광펜으로 그은 듯한 바 */
  .range-bar {
    position: absolute;
    left: 0; right: 0;
    top: 3px;
    height: 24px;
    background: #ffd23c;
    opacity: 0.55;
    z-index: 0;
  }
  .range-bar.range-start {
    left: 6px;
    border-top-left-radius: 12px;
    border-bottom-left-radius: 12px;
  }
  .range-bar.range-end {
    right: 6px;
    border-top-right-radius: 12px;
    border-bottom-right-radius: 12px;
  }
  td.today .range-bar {
    opacity: 0.8;
  }
  .range-label {
    position: absolute;
    left: 0;
    top: 30px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 20px;
    font-weight: 600;
    color: #33546b;
    padding: 0 4px;
    z-index: 2;
    pointer-events: none;
  }
  .range-extra {
    position: relative;
    z-index: 2;
  }

  .memo-preview {
    margin-top: 3px;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.3;
    color: #33546b;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 2px;
    cursor: pointer;
  }
  .memo-more-summary {
    margin-top: 2px;
    font-size: 11px;
    color: #7fb8e0;
    text-align: center;
  }
  .memo-list {
    overflow: hidden;
    max-height: calc(100% - 30px);
  }
  .range-extra-list {
    margin-top: 24px;
    max-height: calc(100% - 54px);
  }
  .memo-more {
    font-size: 17px;
    color: #7fb8e0;
  }
  .todo-done-preview {
    text-decoration: line-through;
    opacity: 0.6;
  }
  .memo-preview.todo-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
  }
  .memo-preview.todo-preview input[type="checkbox"] {
    width: 13px; height: 13px;
    flex-shrink: 0;
    accent-color: #3d8fc0;
    cursor: pointer;
  }
  .memo-preview.todo-preview span {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .memo-item-todo-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .memo-item-todo-row input[type="checkbox"] {
    width: 18px; height: 18px;
    flex-shrink: 0;
    accent-color: #3d8fc0;
    cursor: pointer;
  }

  @media (min-width: 1100px) {
    header {
      position: fixed;
      top: 54px; left: 24px;
      width: 260px;
      background: #eef2f5;
      border: 1px solid #c7d6de;
      border-bottom: 1px solid #c7d6de;
      border-radius: 0 16px 16px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 16px;
      z-index: 20;
    }
    .top-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      max-width: none;
    }
    .month-nav { width: 100%; justify-content: space-between; }
    .right-group { width: 100%; }
    .view-toggle { flex: 1; }
    .account-picker {
      position: fixed;
      top: 28px; left: 24px;
      width: auto;
      flex-direction: row;
      gap: 3px;
      margin: 0;
      z-index: 19;
    }
    .acc-card {
      background: #dbe4ea;
      border: 1px solid #c7d6de;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      box-shadow: none;
      padding: 5px 12px 8px;
      gap: 4px;
    }
    .acc-card {
      padding: 6px 10px 8px;
    }
    .acc-card .acc-emoji { font-size: 18px; }
    .acc-card .acc-name {
      display: none;
    }
    .acc-card.active {
      background: #eef2f5;
      border-color: #3d8fc0;
      box-shadow: none;
    }
    main { max-width: none; width: 100%; margin: 0; padding: 24px 24px 40px 310px; box-sizing: border-box; }
    #calendarWrap {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      gap: 14px;
      padding-bottom: 10px;
    }
    .month-block {
      flex: 0 0 calc(50% - 7px);
      scroll-snap-align: start;
      min-height: calc(6 * var(--row-h, 120px) + 110px);
    }
    td { height: var(--row-h, 120px); font-size: 19px; }
    .month-title { font-size: 26px; }
    th { font-size: 15px; }
    .memo-preview { font-size: 15px; }
    .memo-preview.todo-preview input[type="checkbox"] { width: 15px; height: 15px; }
    .range-label { font-size: 16px; top: 30px; }
    .range-extra-list { margin-top: 24px; }
    .holiday-name { font-size: 15px; }
    .holiday-alt-label { font-size: 15px; top: -20px; }
    .holiday-alt-arrow { font-size: 15px; }
    .day-num { width: 30px; height: 30px; line-height: 30px; }
  }

  /* ===== 하단 입력 바 ===== */
  .quickadd-modal {
    max-width: 480px;
  }
  @media (min-width: 1100px) {
    .date-input-wrap { flex: 1 1 auto; }
    #manageBg {
      background: none;
      pointer-events: none;
      align-items: flex-start;
      justify-content: flex-end;
    }
    #manageBg .modal {
      pointer-events: auto;
      position: fixed;
      top: 84px;
      left: auto;
      right: 24px;
      bottom: 40px;
      width: 300px;
      max-width: 300px;
      margin: 0;
      border-radius: 16px;
      border: 1px solid #c7d6de;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      max-height: none;
    }
  }
  .input-row1 { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  #endDateRow { display: none; }
  #endDateRow.show { display: flex; }
  .range-toggle {
    font-family: inherit;
    font-size: 12.5px;
    color: #33505f;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .range-toggle input[type="checkbox"] {
    width: 15px; height: 15px;
    accent-color: #3d8fc0;
  }
  .range-tilde {
    font-size: 14px;
    color: #33505f;
    flex-shrink: 0;
    width: 12px;
    text-align: center;
  }
  .date-input-wrap {
    flex: 0 0 150px;
    position: relative;
    display: flex;
    align-items: center;
    border: 1px solid #c7d6de;
    border-radius: 10px;
    background: #f5f8fa;
    overflow: hidden;
  }
  .date-input-wrap input[type="text"] {
    font-family: inherit;
    border: none; background: transparent;
    padding: 8px 4px 8px 8px;
    font-size: 13px;
    width: 100%;
    min-width: 0;
  }
  .date-input-wrap button {
    font-family: inherit;
    border: none; background: transparent;
    font-size: 15px;
    padding: 6px 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .date-input-wrap input[type="date"] {
    position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;
  }
  .input-row1 textarea.memo-text {
    flex: 1; min-width: 0;
    font-family: inherit;
    border: 1px solid #c7d6de;
    border-radius: 10px;
    padding: 8px 8px;
    font-size: 14px;
    background: #f5f8fa;
    resize: vertical;
    line-height: 1.4;
  }
  button.add-btn {
    font-family: inherit;
    width: 100%;
    background: #3d8fc0; color: #fff; border: none;

<script>
/* ===== Firebase 클라우드 동기화 (로그인한 사용자별로 데이터 분리) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCbs8pGZgRcr9vncl-DsyRsl166y1245ic",
  authDomain: "dadameun-calendar.firebaseapp.com",
  projectId: "dadameun-calendar",
  storageBucket: "dadameun-calendar.firebasestorage.app",
  messagingSenderId: "502238795650",
  appId: "1:502238795650:web:34a152fe0829901b18e19b"
};
let cloudDb = null;
let cloudDocRef = null;
let CLIENT_ID = null;
let firebaseReady = false;
try {
  firebase.initializeApp(firebaseConfig);
  cloudDb = firebase.firestore();
  CLIENT_ID = localStorage.getItem('dadameunClientId');
  if (!CLIENT_ID) {
    CLIENT_ID = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('dadameunClientId', CLIENT_ID);
  }
  firebaseReady = true;
} catch (e) {
  console.warn('Firebase 초기화 실패 - 클라우드 동기화 없이 동작합니다.', e);
}

function collectLocalData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('yearlyCalendar')) {
      data[k] = localStorage.getItem(k);
    }
  }
  return data;
}
function applyCloudData(cloudData) {
  Object.keys(cloudData || {}).forEach((k) => {
    if (k.startsWith('yearlyCalendar')) {
      localStorage.setItem(k, cloudData[k]);
    }
  });
}

let pushTimer = null;
function pushToCloud() {
  if (!cloudDocRef) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    cloudDocRef.set({
      data: collectLocalData(),
      updatedAt: Date.now(),
      updatedBy: CLIENT_ID
    }).catch((e) => console.warn('클라우드 저장 실패', e));
  }, 800);
}

/* 로그인한 사용자(uid)의 문서와 동기화를 시작. 로그인 성공 후 한 번만 호출됨 */
function startCloudSyncForUser(uid) {
  const overlay = document.getElementById('syncOverlay');
  if (!firebaseReady) {
    if (overlay) overlay.classList.add('hidden');
    return;
  }
  cloudDocRef = cloudDb.collection('calendarData').doc(uid);
  const alreadyPulled = sessionStorage.getItem('dadameunCloudPulled_' + uid);

  if (alreadyPulled) {
    if (overlay) overlay.classList.add('hidden');
    // 실시간 반영: 다른 기기에서 바뀌면 자동으로 최신화
    let isFirstSnapshot = true;
    cloudDocRef.onSnapshot((snap) => {
      if (isFirstSnapshot) { isFirstSnapshot = false; return; } // 구독 직후 즉시 오는 첫 콜백은 무시
      if (!snap.exists) return;
      const remote = snap.data();
      if (remote.updatedBy === CLIENT_ID) return; // 내가 방금 쓴 변경은 무시
      applyCloudData(remote.data);
      location.reload();
    });
    return;
  }

  if (overlay) overlay.classList.remove('hidden');
  cloudDocRef.get().then((snap) => {
    if (snap.exists) {
      const remote = snap.data();
      if (remote.updatedBy !== CLIENT_ID) {
        applyCloudData(remote.data);
      }
    }
  }).catch((e) => {
    console.warn('클라우드 불러오기 실패', e);
  }).finally(() => {
    sessionStorage.setItem('dadameunCloudPulled_' + uid, '1');
    location.reload();
  });
}

/* ===== 로그인 (Firebase Auth 이메일/비밀번호) ===== */
let authInstance = null;

  authInstance = firebase.auth();

}

(function initLoginGate() {
  const pwGate = document.getElementById('pwGate');
  const pwEmail = document.getElementById('pwEmail');
  const pwInput = document.getElementById('pwInput');
  const pwError = document.getElementById('pwError');
  const pwSubmit = document.getElementById('pwSubmit');

  if (!authInstance) {
    // Firebase Auth를 못 쓰면 로그인 없이 그냥 진행 (클라우드 동기화도 생략)
    pwGate.classList.add('hidden');
    return;
  }

  function friendlyError(code) {
    if (code === 'auth/invalid-email') return '이메일 형식이 올바르지 않아요.';
    if (code === 'auth/user-not-found') return '존재하지 않는 계정이에요.';
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return '이메일 또는 비밀번호가 틀렸어요.';
    return '문제가 발생했어요. 다시 시도해주세요.';
  }

  async function handleLogin() {
    pwError.textContent = '';
    const email = pwEmail.value.trim();
    const pass = pwInput.value;
    if (!email || !pass) { pwError.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
    try {
      await authInstance.signInWithEmailAndPassword(email, pass);
    } catch (e) {
      pwError.textContent = friendlyError(e.code);
    }
  }

  pwSubmit.addEventListener('click', handleLogin);
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
  pwEmail.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

  authInstance.onAuthStateChanged((user) => {
    if (user) {
      pwGate.classList.add('hidden');
      startCloudSyncForUser(user.uid);
    } else {
      pwGate.classList.remove('hidden');
      pwInput.value = '';
    }
  });

  const lockBtn = document.getElementById('lockBtn');
  if (lockBtn) {
    lockBtn.addEventListener('click', () => {
      if (!confirm('로그아웃할까요?')) return;
      authInstance.signOut();
    });
  }
})();

function migrateMemosObj(obj) {
  Object.keys(obj).forEach((k) => {
    obj[k] = obj[k].map((it) =>
      typeof it === 'string' ? { text: it, groupId: null, start: null, end: null } : it
    );
  });
  return obj;
}

function loadMemosFor(acc) {
  const key = storageKeyFor(acc);
  let raw = localStorage.getItem(key);
  if (raw === null && acc === '1') {
    // 계정 구분이 없던 예전 버전의 데이터를 계정1로 1회 이관
    const legacy = localStorage.getItem('yearlyCalendarMemos');
    if (legacy !== null) {
      localStorage.setItem(key, legacy);
      raw = legacy;
    }
  }
  const parsed = JSON.parse(raw || '{}');
  return migrateMemosObj(parsed);
}

function pad(n) { return String(n).padStart(2, '0'); }

function firstLine(text) {
  if (!text) return '';
  const line = text.split('\n')[0];
  return text.includes('\n') ? line + ' …' : line;
}
function keyOf(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

/* 달력 칸 안에서 항목 목록이 넘치면 넘치는 만큼 "+N개" 요약으로 정리 */
function trimOverflowList(td, list) {
  const totalItems = list.children.length;
  // max-height가 적용된 후 실제로 넘치는지 확인
  requestAnimationFrame(() => {
    if (list.scrollHeight <= list.clientHeight + 1) return;
    let hiddenCount = 0;
    while (list.scrollHeight > list.clientHeight + 1 && list.children.length > 1) {
      list.removeChild(list.lastElementChild);
      hiddenCount++;
    }
    if (hiddenCount > 0) {
      const summary = document.createElement('div');
      summary.className = 'memo-more-summary';
      summary.textContent = `+${hiddenCount}개`;
      list.appendChild(summary);
    }
  });
}

function buildMonthBlock(year, month) {
  const block = document.createElement('div');
  block.className = 'month-block';
  block.id = `month-${year}-${pad(month + 1)}`;
  block.dataset.year = year;
  block.dataset.month = month;

  const title = document.createElement('div');
  title.className = 'month-title';
  title.textContent = `${year}년 ${month + 1}월`;
  block.appendChild(title);

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trHead = document.createElement('tr');
  ['일','월','화','수','목','금','토'].forEach((d, i) => {
    const th = document.createElement('th');
    th.textContent = d;
    if (i === 0) th.className = 'sun';
    if (i === 6) th.className = 'sat';
    trHead.appendChild(th);
  });
  thead.appendChild(trHead);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const isThisMonth = today.getFullYear() === year && today.getMonth() === month;

  let day = 1;
  for (let row = 0; row < 6 && day <= daysInMonth; row++) {
    const tr = document.createElement('tr');
    const rowCells = new Array(7).fill(null);

    for (let col = 0; col < 7; col++) {
      const td = document.createElement('td');
      if ((row === 0 && col < firstDay) || day > daysInMonth) {
        td.className = 'empty';
      } else {
        if (col === 0) td.classList.add('sun-cell');
        if (col === 6) td.classList.add('sat-cell');

        const k = keyOf(year, month, day);
        const items = memos[k] || [];
        const holidayName = HOLIDAYS[k];
        const rangeItem = items.find((it) => it.groupId);
        if (items.length > 0 && !rangeItem) {
          td.classList.add('has-memo');
          if (items[0].bgColor) td.style.setProperty('--memo-color', items[0].bgColor);
        }
        if (holidayName) td.classList.add('holiday');
        if (isThisMonth && today.getDate() === day) td.classList.add('today');

        if (rangeItem) {
          const bar = document.createElement('div');
          bar.className = 'range-bar';
          if (k === rangeItem.start || col === 0) bar.classList.add('range-start');
          if (k === rangeItem.end || col === 6) bar.classList.add('range-end');
          if (rangeItem.bgColor) bar.style.backgroundColor = rangeItem.bgColor;
          td.appendChild(bar);
        }

        const dNum = document.createElement('span');
        dNum.className = 'day-num';
        dNum.textContent = day;
        td.appendChild(dNum);

        if (holidayName === '대체공휴일') {

              row.appendChild(cb);
              row.appendChild(txt);
              list.appendChild(row);
            } else {
              const row = document.createElement('div');
              row.className = 'memo-preview';
              row.textContent = (it.alarmTime ? '⏰ ' : '') + (it.isDday && it.ddayTarget ? '[' + computeDdayLabel(it.ddayTarget) + '] ' : '') + firstLine(it.text);
              if (it.color) row.style.color = it.color;
              list.appendChild(row);
            }
          });
          td.appendChild(list);
          trimOverflowList(td, list);
        }

        td.dataset.date = k;
        td.addEventListener('mousedown', (e) => {
          if (window.innerWidth < 1100) return;
          dragState = { startKey: k, currentKey: k };
          dragMoved = false;
        });
        td.addEventListener('click', (e) => {
          if (dragMoved) { dragMoved = false; return; }
          selectDate(k);
          openQuickAdd(k, null, e.currentTarget);
        });
        rowCells[col] = { td, rangeItem };
        day++;
      }
      tr.appendChild(td);
    }

    // 2단계: 이 행 안에서 같은 기간(그룹)으로 이어지는 칸을 찾아
    // 시작 칸에 여러 칸 폭으로 걸치는 중앙정렬 라벨을 한 번만 붙임
    let seg = null;
    for (let c = 0; c <= 7; c++) {
      const cell = c < 7 ? rowCells[c] : null;
      const gid = cell && cell.rangeItem ? cell.rangeItem.groupId : null;
      if (seg && gid === seg.groupId) {
        seg.length++;
      } else {
        if (seg) {
          const label = document.createElement('div');
          label.className = 'range-label';
          label.textContent = seg.isTodo ? (seg.done ? '☑ ' : '☐ ') + firstLine(seg.text) : firstLine(seg.text);
          label.style.width = (seg.length * 100) + '%';
          if (seg.color) label.style.color = seg.color;
          if (seg.isTodo && seg.done) label.classList.add('todo-done-preview');
          seg.startTd.appendChild(label);
        }
        seg = cell && gid ? { groupId: gid, text: cell.rangeItem.text, length: 1, startTd: cell.td, color: cell.rangeItem.color, isTodo: cell.rangeItem.isTodo, done: cell.rangeItem.done } : null;
      }
    }

    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  block.appendChild(table);
  return block;
}

let suppressScrollUpdate = false;
let viewMode = 'scroll';
let overviewYear = curYear;

function buildMiniMonth(year, month) {
  const block = document.createElement('div');
  block.className = 'mini-month';
  block.id = `mini-${year}-${pad(month + 1)}`;

  const title = document.createElement('div');
  title.className = 'mini-title';
  title.textContent = `${year}년 ${month + 1}월`;
  block.appendChild(title);

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trHead = document.createElement('tr');
  ['일','월','화','수','목','금','토'].forEach((d, i) => {
    const th = document.createElement('th');
    th.textContent = d;
    if (i === 0) th.className = 'sun';
    if (i === 6) th.className = 'sat';
    trHead.appendChild(th);
  });
  thead.appendChild(trHead);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const isThisMonth = today.getFullYear() === year && today.getMonth() === month;

  let day = 1;
  for (let row = 0; row < 6 && day <= daysInMonth; row++) {
    const tr = document.createElement('tr');
    for (let col = 0; col < 7; col++) {
      const td = document.createElement('td');
      if ((row === 0 && col < firstDay) || day > daysInMonth) {
        // empty cell
      } else {
        if (col === 0) td.classList.add('sun-cell');
        if (col === 6) td.classList.add('sat-cell');
        if (isThisMonth && today.getDate() === day) td.classList.add('mini-today');

        const k = keyOf(year, month, day);
        if (HOLIDAYS[k]) td.classList.add('holiday');

        const span = document.createElement('span');
        span.textContent = day;
        td.appendChild(span);

        if (memos[k] && memos[k].length > 0) {
          const dot = document.createElement('div');
          dot.className = memos[k].some((it) => it.groupId) ? 'mini-dot mini-dot-range' : 'mini-dot';
          td.appendChild(dot);
        }
        day++;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  block.appendChild(table);
  block.addEventListener('click', () => selectMonth(year, month, false));
  return block;
}

function scrollToMini(year, month, smooth) {

function setViewMode(mode) {

  const wrap = document.getElementById('calendarWrap');
  const overview = document.getElementById('yearOverview');
  const toggleBtn = document.getElementById('toggleView');
  if (mode === 'overview') {

function selectMonth(year, month, smooth) {
  curYear = year; curMonth = month;
  renderCalendar();

function renderCalendar() {
  document.getElementById('monthYearLabel').textContent = `${curYear}년 ${curMonth + 1}월`;

  const wrap = document.getElementById('calendarWrap');
  wrap.innerHTML = '';
  for (let m = 0; m < 12; m++) {

function scrollToMonth(year, month, smooth) {
  suppressScrollUpdate = true;
  const target = document.getElementById(`month-${year}-${pad(month + 1)}`);
  if (target) {
    const wrap = document.getElementById('calendarWrap');
    wrap.scrollTo({ left: target.offsetLeft, behavior: smooth ? 'smooth' : 'auto' });
  }
  window.setTimeout(() => { suppressScrollUpdate = false; }, smooth ? 500 : 50);
}

function onHorizontalScroll() {
  if (suppressScrollUpdate || viewMode !== 'scroll') return;
  const wrap = document.getElementById('calendarWrap');
  const blocks = document.querySelectorAll('.month-block');
  let active = null;
  blocks.forEach((b) => {
    if (b.offsetLeft - wrap.scrollLeft <= 10) active = b;
  });
  if (active) {
    const y = Number(active.dataset.year), m = Number(active.dataset.month);
    if (y !== curYear || m !== curMonth) {
      curYear = y; curMonth = m;
      document.getElementById('monthYearLabel').textContent = `${curYear}년 ${curMonth + 1}월`;
    }
  }
}
let hScrollTicking = false;
document.getElementById('calendarWrap').addEventListener('scroll', () => {
  if (!hScrollTicking) {
    window.requestAnimationFrame(() => { onHorizontalScroll(); hScrollTicking = false; });
    hScrollTicking = true;
  }
}, { passive: true });

    const applyAll = confirm('이 기간 전체에 수정 내용을 적용할까요?\n확인: 기간 전체 적용 / 취소: 이 날짜만 적용');

      Object.keys(memos).forEach((k) => {
        memos[k].forEach((it) => { if (it.groupId === item.groupId) it.text = trimmed; });

function formatShortDate(key) {
  const [y, m, d] = key.split('-').map(Number);

}

/* ===== 디데이 ===== */
function computeDdayLabel(targetKey) {
  const target = keyToDate(targetKey);
  target.setHours(0, 0, 0, 0);
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  const diffDays = Math.round((target - t) / 86400000);
  if (diffDays === 0) return 'D-DAY';
  if (diffDays > 0) return 'D-' + diffDays;
  return 'D+' + Math.abs(diffDays);
}
function updateDdayWidget() {
  renderSelectedAgenda();
  const widget = document.getElementById('ddayWidget');
  const todayStr = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
  const todayDate = keyToDate(todayStr);
  let nearest = null;
  Object.keys(memos).forEach((k) => {
    memos[k].forEach((it) => {
      if (it.isDday && it.ddayTarget) {
        const target = keyToDate(it.ddayTarget);
        if (target >= todayDate && (!nearest || target < keyToDate(nearest.ddayTarget))) {
          nearest = it;
        }
      }
    });
  });
  if (!nearest) {
    widget.style.display = 'none';
    return;
  }
  widget.style.display = 'block';
  widget.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'dday-widget-label';
  label.textContent = '📌 디데이 · ' + formatShortDate(nearest.ddayTarget);
  const textRow = document.createElement('div');
  textRow.className = 'dday-widget-text';
  const textSpan = document.createElement('span');
  textSpan.textContent = nearest.text;
  const countSpan = document.createElement('span');
  countSpan.className = 'dday-widget-count';
  countSpan.textContent = computeDdayLabel(nearest.ddayTarget);
  textRow.appendChild(textSpan);
  textRow.appendChild(countSpan);
  widget.appendChild(label);
  widget.appendChild(textRow);
  widget.onclick = () => {
    const [y, m] = nearest.ddayTarget.split('-').map(Number);
    selectDate(nearest.ddayTarget);
    selectMonth(y, m - 1, true);
  };
}

function buildMemoItemCard(key, idx, refreshFn) {
  const item = memos[key][idx];
  const div = document.createElement('div');
  div.className = 'memo-item';

  if (item.groupId) {
    const rangeLabel = document.createElement('div');
    rangeLabel.className = 'memo-item-range';
    rangeLabel.textContent = `기간: ${formatShortDate(item.start)} ~ ${formatShortDate(item.end)}`;
    div.appendChild(rangeLabel);
  }

  const textWrap = document.createElement('div');
  textWrap.className = 'memo-item-text';
  if (item.isTodo) {
    const todoRow = document.createElement('label');
    todoRow.className = 'memo-item-todo-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!item.done;
    cb.addEventListener('change', () => {
      toggleMemoTodoDone(key, idx, cb.checked);
    });
    const span = document.createElement('span');
    span.textContent = (item.alarmTime ? '⏰ ' + item.alarmTime + ' ' : '') + (item.isDday && item.ddayTarget ? '[' + computeDdayLabel(item.ddayTarget) + '] ' : '') + item.text;
    if (item.done) span.classList.add('todo-done-preview');
    todoRow.appendChild(cb);
    todoRow.appendChild(span);
    textWrap.appendChild(todoRow);
  } else {
    const span = document.createElement('span');
    span.textContent = (item.alarmTime ? '⏰ ' + item.alarmTime + ' ' : '') + (item.isDday && item.ddayTarget ? '[' + computeDdayLabel(item.ddayTarget) + '] ' : '') + item.text;
    textWrap.appendChild(span);
  }
  div.appendChild(textWrap);

  if (item.image) {
    const thumb = document.createElement('img');
    thumb.className = 'memo-item-thumb';
    thumb.src = item.image;
    thumb.addEventListener('click', () => {
      document.getElementById('lightboxImg').src = item.image;
      document.getElementById('imgLightbox').classList.add('show');
    });
    div.appendChild(thumb);
  }

  const actions = document.createElement('div');
  actions.className = 'memo-item-actions';

  const editBtn = document.createElement('button');
  editBtn.textContent = '수정';
  editBtn.addEventListener('click', () => editMemoItem(key, idx));
  actions.appendChild(editBtn);

  function makeColorBtn(label, field) {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      const pickerClass = 'color-picker-inline-' + field;
      const existing = div.querySelector('.' + pickerClass);
      if (existing) { existing.remove(); return; }
      div.querySelectorAll('.color-picker-inline').forEach((el) => el.remove());
      const picker = document.createElement('div');
      picker.className = 'color-picker-inline ' + pickerClass;
      COLOR_PRESETS.forEach((c) => {
        const sw = document.createElement('button');
        sw.type = 'button';
        sw.className = c ? 'swatch' : 'swatch swatch-default';
        if (c) sw.style.background = c;
        if ((item[field] || '') === c) sw.classList.add('active');
        sw.addEventListener('click', () => changeMemoColor(key, idx, field, c));
        picker.appendChild(sw);
      });
      div.appendChild(picker);
    });
    return btn;
  }
  actions.appendChild(makeColorBtn('글자색', 'color'));
  actions.appendChild(makeColorBtn('배경색', 'bgColor'));

  const delOneBtn = document.createElement('button');
  delOneBtn.textContent = (item.groupId || item.repeatId) ? '이날만' : '삭제';
  delOneBtn.addEventListener('click', () => {
    memos[key].splice(idx, 1);
    if (memos[key].length === 0) delete memos[key];
    saveMemos();
    renderCalendar();
    updateDdayWidget();
    if (refreshFn) refreshFn();
  });
  actions.appendChild(delOneBtn);

  if (item.groupId) {
    const delAllBtn = document.createElement('button');
    delAllBtn.className = 'btn-del-range';
    delAllBtn.textContent = '기간 전체 삭제';
    delAllBtn.addEventListener('click', () => {
      if (!confirm('이 기간에 등록된 모든 날짜의 내용을 삭제할까요?')) return;
      deleteRangeGroup(item.groupId);
      renderCalendar();
      updateDdayWidget();
      if (refreshFn) refreshFn();
    });
    actions.appendChild(delAllBtn);
  }

  if (item.repeatId) {
    const delRepeatBtn = document.createElement('button');
    delRepeatBtn.className = 'btn-del-range';
    delRepeatBtn.textContent = '반복 전체 삭제';
    delRepeatBtn.addEventListener('click', () => {
      if (!confirm('이 반복 일정의 모든 회차를 삭제할까요?')) return;
      Object.keys(memos).forEach((k) => {
        memos[k] = memos[k].filter((it) => it.repeatId !== item.repeatId);
        if (memos[k].length === 0) delete memos[k];
      });
      saveMemos();
      renderCalendar();
      updateDdayWidget();
      if (refreshFn) refreshFn();
    });
    actions.appendChild(delRepeatBtn);
  }

  div.appendChild(actions);
  return div;
}

let lastModalAnchor = null;

    const rect = lastModalAnchor.getBoundingClientRect();
    const modalWidth = Math.min(300, window.innerWidth * 0.92);
    let left = rect.left;
    let top = rect.bottom + 8;
    // 화면 오른쪽 밖으로 나가지 않게 보정
    if (left + modalWidth > window.innerWidth - 12) {
      left = window.innerWidth - modalWidth - 12;
    }
    if (left < 12) left = 12;
    // 아래쪽 공간이 부족하면 날짜 칸 위쪽에 띄움
    const estHeight = Math.min(modalEl.scrollHeight || 300, window.innerHeight * 0.7);
    if (top + estHeight > window.innerHeight - 12) {
      top = rect.top - estHeight - 8;
      if (top < 12) top = 12;
    }
    modalEl.style.top = top + 'px';
    modalEl.style.left = left + 'px';
  }
}

/* ===== 달력에서 일정 하나를 클릭했을 때 뜨는 개별 팝업 (날짜 전체 목록과 구분) ===== */
function positionPopupNear(modalEl, anchorEl) {
  if (!anchorEl || !modalEl) return;
  const rect = anchorEl.getBoundingClientRect();
  const modalWidth = parseInt(getComputedStyle(modalEl).width, 10) || 280;
  const estHeight = Math.min(modalEl.scrollHeight || 260, window.innerHeight * 0.7);

  // 기본: 선택한 날짜의 오른쪽에 표시
  let left = rect.right + 8;
  let top = rect.top;

  // 오른쪽 공간이 부족하면 왼쪽으로
  if (left + modalWidth > window.innerWidth - 12) {
    left = rect.left - modalWidth - 8;
  }
  // 왼쪽에도 공간이 부족하면(양쪽 다 안 맞음) 화면 안으로 클램프
  if (left < 12) left = 12;
  if (left + modalWidth > window.innerWidth - 12) {
    left = window.innerWidth - modalWidth - 12;
  }

  if (top + estHeight > window.innerHeight - 12) {
    top = window.innerHeight - estHeight - 12;
  }
  if (top < 12) top = 12;

  modalEl.style.top = top + 'px';
  modalEl.style.left = left + 'px';
}

/* ===== 등록된 내용 전체 관리 (같은 내용 일괄 삭제) ===== */
function getMemoSummary() {
  const map = {};
  Object.keys(memos).forEach((k) => {
    memos[k].forEach((it) => {
      if (!map[it.text]) map[it.text] = { count: 0, dates: [] };
      map[it.text].count++;
      map[it.text].dates.push(k);
    });
  });
  return map;
}

function openManageModal() {
  const map = getMemoSummary();
  const list = document.getElementById('manageList');
  list.innerHTML = '';
  const texts = Object.keys(map).sort();
  if (texts.length === 0) {
    list.innerHTML = '<div class="empty-memo">등록된 내용이 없어요.</div>';

      actions.appendChild(delBtn);

/* 알람 시간 입력을 "HH:MM"으로 정규화. "1500"→15:00, "900"→09:00, "9"→09:00, "15:00"도 그대로 인식 */
function normalizeAlarmTime(raw) {
  if (!raw) return null;
  const trimmed = raw.trim();
  if (/^\d{1,2}:\d{2}$/.test(trimmed)) {
    const [h, m] = trimmed.split(':').map(Number);
    if (h >= 0 && h <= 23 && m >= 0 && m <= 59) return `${pad(h)}:${pad(m)}`;
    return null;
  }
  const digits = trimmed.replace(/\D/g, '');
  if (digits.length === 3 || digits.length === 4) {
    const padded = digits.padStart(4, '0');
    const h = Number(padded.slice(0, 2));
    const m = Number(padded.slice(2, 4));
    if (h >= 0 && h <= 23 && m >= 0 && m <= 59) return `${pad(h)}:${pad(m)}`;
    return null;
  }
  if (digits.length === 1 || digits.length === 2) {
    const h = Number(digits);
    if (h >= 0 && h <= 23) return `${pad(h)}:00`;
  }
  return null;
}

function getDateKeyFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest && el.closest('td[data-date]');
  return cell ? cell.dataset.date : null;
}
function clearDragHighlight() {
  document.querySelectorAll('td.drag-selected').forEach((el) => el.classList.remove('drag-selected'));
}
function applyDragHighlight(startKey, endKey) {
  clearDragHighlight();
  if (!startKey || !endKey) return;
  const a = keyToDate(startKey), b = keyToDate(endKey);
  const lo = a < b ? a : b, hi = a < b ? b : a;
  document.querySelectorAll('td[data-date]').forEach((td) => {
    const d = keyToDate(td.dataset.date);
    if (d >= lo && d <= hi) td.classList.add('drag-selected');
  });
}
document.addEventListener('mousemove', (e) => {
  if (!dragState) return;
  const dk = getDateKeyFromPoint(e.clientX, e.clientY);
  if (dk && dk !== dragState.currentKey) {
    dragState.currentKey = dk;
    dragMoved = true;
    applyDragHighlight(dragState.startKey, dragState.currentKey);
  }
});
document.addEventListener('mouseup', () => {
  if (!dragState) return;
  clearDragHighlight();
  const { startKey, currentKey } = dragState;
  dragState = null;
  if (dragMoved && startKey !== currentKey) {
    const a = keyToDate(startKey), b = keyToDate(currentKey);
    const sKey = a < b ? startKey : currentKey;
    const eKey = a < b ? currentKey : startKey;
    selectDate(sKey);

});

/* 모달 제목바를 드래그해서 팝업 위치를 옮길 수 있게 함 */
function makeDraggable(modalEl, handleEl) {
  let dragging = false;
  let offsetX = 0, offsetY = 0;
  handleEl.addEventListener('mousedown', (e) => {
    dragging = true;
    const rect = modalEl.getBoundingClientRect();
    modalEl.style.position = 'fixed';
    modalEl.style.margin = '0';
    modalEl.style.top = rect.top + 'px';
    modalEl.style.left = rect.left + 'px';
    modalEl.style.bottom = 'auto';
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    let left = e.clientX - offsetX;
    let top = e.clientY - offsetY;
    left = Math.max(4, Math.min(left, window.innerWidth - 60));
    top = Math.max(4, Math.min(top, window.innerHeight - 40));
    modalEl.style.left = left + 'px';
    modalEl.style.top = top + 'px';
  });
  document.addEventListener('mouseup', () => { dragging = false; });
}

function normalizeDate(raw) {
  const digits = raw.replace(/\D/g, '');
  if (digits.length !== 8) return null;
  const y = digits.slice(0,4), m = digits.slice(4,6), d = digits.slice(6,8);
  const dt = new Date(`${y}-${m}-${d}`);
  if (isNaN(dt.getTime())) return null;
  if (dt.getFullYear() != y || (dt.getMonth()+1) != Number(m) || dt.getDate() != Number(d)) return null;
  return `${y}-${m}-${d}`;
}

function isValidDateKey(key) {
  const [y, mo, d] = key.split('-').map(Number);
  const dt = new Date(y, mo - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
}

/* 본문 안에 "26.05.26-7.28 접수" 처럼 섞여 있는 날짜 범위를 찾아 분리
   (날짜 안 구분자는 . 또는 / 만 허용, 시작~종료 구분은 - 로 인식) */
function parseInlineRange(text) {
  // 형식 A: 26.08.20-09.19 / 26/08/20-9/19 처럼 구분자(.  /)가 있는 경우
  let re = /(\d{2,4})[.\/](\d{1,2})[.\/](\d{1,2})\s*-\s*(?:(\d{2,4})[.\/])?(\d{1,2})[.\/](\d{1,2})/;
  let m = text.match(re);
  if (m) {
    const normY = (y) => (y.length === 2 ? '20' + y : y);
    const sy = normY(m[1]), sm = m[2].padStart(2, '0'), sd = m[3].padStart(2, '0');
    const ey = m[4] ? normY(m[4]) : sy;
    const em = m[5].padStart(2, '0'), ed = m[6].padStart(2, '0');
    const startKey = `${sy}-${sm}-${sd}`;
    const endKey = `${ey}-${em}-${ed}`;
    if (isValidDateKey(startKey) && isValidDateKey(endKey)) {
      const remaining = (text.slice(0, m.index) + text.slice(m.index + m[0].length)).trim();
      return { startKey, endKey, remaining };
    }
  }

  // 형식 B: 260820-0916 / 20260820-20260916 처럼 구분자 없이 숫자만 붙여쓴 경우
  // 시작일은 6자리(YYMMDD) 또는 8자리(YYYYMMDD), 종료일은 4자리(MMDD)/6자리/8자리
  re = /(?<!\d)(\d{8}|\d{6})(?!\d)\s*-\s*(?<!\d)(\d{8}|\d{6}|\d{4})(?!\d)/;
  m = text.match(re);
  if (m) {
    const sDigits = m[1];
    const sy = sDigits.length === 8 ? sDigits.slice(0, 4) : '20' + sDigits.slice(0, 2);
    const sOff = sDigits.length === 8 ? 4 : 2;
    const sm = sDigits.slice(sOff, sOff + 2);
    const sd = sDigits.slice(sOff + 2, sOff + 4);

    const eDigits = m[2];
    let ey, em, ed;
    if (eDigits.length === 4) {
      ey = sy; em = eDigits.slice(0, 2); ed = eDigits.slice(2, 4);
    } else if (eDigits.length === 6) {
      ey = '20' + eDigits.slice(0, 2); em = eDigits.slice(2, 4); ed = eDigits.slice(4, 6);
    } else {
      ey = eDigits.slice(0, 4); em = eDigits.slice(4, 6); ed = eDigits.slice(6, 8);
    }

    const startKey = `${sy}-${sm}-${sd}`;
    const endKey = `${ey}-${em}-${ed}`;
    if (isValidDateKey(startKey) && isValidDateKey(endKey)) {
      const remaining = (text.slice(0, m.index) + text.slice(m.index + m[0].length)).trim();
      return { startKey, endKey, remaining };
    }
  }

  return null;
}

function keyToDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

/* 시작일~종료일 사이 모든 날짜에 같은 내용을 그룹으로 묶어 등록 */
function registerRange(startKey, endKey, text, color, bgColor, isTodo, alarmTime, isDday, image) {
  let s = keyToDate(startKey), e = keyToDate(endKey);
  if (s > e) { const tmp = s; s = e; e = tmp; }
  const startK = keyOf(s.getFullYear(), s.getMonth(), s.getDate());
  const endK = keyOf(e.getFullYear(), e.getMonth(), e.getDate());
  const groupId = `rg_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  const cur = new Date(s);
  let count = 0;
  while (cur <= e && count < 400) {
    const k = keyOf(cur.getFullYear(), cur.getMonth(), cur.getDate());
    if (!memos[k]) memos[k] = [];
    memos[k].push({ text, groupId, start: startK, end: endK, color: color || null, bgColor: bgColor || null, isTodo: !!isTodo, done: false, alarmTime: alarmTime || null, alarmFired: false, isDday: !!isDday, ddayTarget: isDday ? endK : null, image: image || null });
    cur.setDate(cur.getDate() + 1);
    count++;
  }
  saveMemos();
  return s;
}

document.getElementById('addBtn').addEventListener('click', () => {
  const rawText = document.getElementById('memoText').value.trim();
  if (!rawText) {
    alert('내용을 입력해주세요.');
    return;
  }

  let alarmTimeValue = null;
  if (alarmToggle.checked) {
    alarmTimeValue = normalizeAlarmTime(alarmTimeInput.value);
    if (!alarmTimeValue) {
      alert('알람 시간을 정확히 입력해주세요 (예: 1500, 9:00).');
      return;
    }
  }
  const ddayValue = ddayToggle.checked;

  function resetInputs() {
    document.getElementById('memoText').value = '';
    alarmToggle.checked = false;
    alarmTimeInput.value = '';
    alarmTimeInput.style.display = 'none';
    ddayToggle.checked = false;
    repeatSelect.value = 'none';
    repeatUntilInput.value = '';
    resetImageAttachment();
  }

  // 1) 내용 안에 날짜 범위가 함께 타이핑된 경우 (예: 26.05.26~7.28 접수)
  const inline = parseInlineRange(rawText);
  if (inline) {
    if (!inline.remaining) {
      alert('날짜 뒤에 등록할 내용을 함께 입력해주세요.');
      return;
    }
    const start = registerRange(inline.startKey, inline.endKey, inline.remaining, selectedColor, selectedBgColor, todoToggle.checked, alarmTimeValue, ddayValue, pendingImageData);
    resetInputs();
    renderCalendar();
    updateDdayWidget();
    document.getElementById('quickAddBg').classList.remove('show');
    selectDate(inline.startKey);
    selectMonth(start.getFullYear(), start.getMonth(), true);
    return;
  }

  // 2) "기간" 토글로 시작일~종료일을 따로 지정한 경우
  if (rangeToggle.checked) {
    const s = normalizeDate(dateText.value);
    const e = normalizeDate(dateText2.value);
    if (!s || !e) {
      alert('시작일과 종료일을 정확히 입력해주세요 (YYYY-MM-DD).');
      return;
    }
    const start = registerRange(s, e, rawText, selectedColor, selectedBgColor, todoToggle.checked, alarmTimeValue, ddayValue, pendingImageData);
    resetInputs();
    renderCalendar();
    updateDdayWidget();
    document.getElementById('quickAddBg').classList.remove('show');
    selectDate(s);
    selectMonth(start.getFullYear(), start.getMonth(), true);
    return;
  }

  // 3) 기본: 하루만 등록 (반복 옵션이 있으면 여러 날짜에 나눠 등록)
  const normalized = normalizeDate(dateText.value);
  if (!normalized) {
    alert('날짜(YYYY-MM-DD)를 정확히 입력해주세요.');
    return;
  }

  const repeatMode = repeatSelect.value;
  if (repeatMode === 'none') {
    if (!memos[normalized]) memos[normalized] = [];
    memos[normalized].push({ text: rawText, groupId: null, start: null, end: null, color: selectedColor, bgColor: selectedBgColor, isTodo: todoToggle.checked, done: false, alarmTime: alarmTimeValue, alarmFired: false, isDday: ddayValue, ddayTarget: ddayValue ? normalized : null, image: pendingImageData });
    saveMemos();
  } else {
    const untilKey = repeatUntilInput.value.trim() ? normalizeDate(repeatUntilInput.value) : null;
    if (repeatUntilInput.value.trim() && !untilKey) {
      alert('반복 종료일을 정확히 입력해주세요 (YYYY-MM-DD).');
      return;
    }
    const repeatId = `rp_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    const untilDate = untilKey ? keyToDate(untilKey) : null;
    const maxCount = repeatMode === 'weekly' ? 52 : 24;
    let cur = keyToDate(normalized);
    let count = 0;
    while (count < maxCount) {
      const k = keyOf(cur.getFullYear(), cur.getMonth(), cur.getDate());
      if (untilDate && cur > untilDate) break;
      if (!memos[k]) memos[k] = [];
      memos[k].push({ text: rawText, groupId: null, start: null, end: null, color: selectedColor, bgColor: selectedBgColor, isTodo: todoToggle.checked, done: false, alarmTime: alarmTimeValue, alarmFired: false, isDday: false, ddayTarget: null, repeatId, image: pendingImageData });
      if (repeatMode === 'weekly') {
        cur.setDate(cur.getDate() + 7);
      } else {
        cur.setMonth(cur.getMonth() + 1);
      }
      count++;
    }
    saveMemos();
  }

  resetInputs();
  renderCalendar();
  updateDdayWidget();
  document.getElementById('quickAddBg').classList.remove('show');
  selectDate(normalized);

  const [y, m] = normalized.split('-').map(Number);
  selectMonth(y, m - 1, true);
});

document.getElementById('prevMonth').addEventListener('click', () => {
  if (viewMode === 'overview') {
    let m = curMonth - 1, y = curYear;
    if (m < 0) { m = 11; y--; }
    curYear = y; curMonth = m;
    document.getElementById('monthYearLabel').textContent = `${curYear}년 ${curMonth + 1}월`;
    if (y !== overviewYear) {
      overviewYear = y;
      renderOverview(overviewYear, m);
      scrollToMini(y, m, false);
    } else {
      scrollToMini(y, m, true);
    }
    return;
  }
  let m = curMonth - 1, y = curYear;
  if (m < 0) { m = 11; y--; }
  if (y !== curYear) {
    curYear = y; curMonth = m;
    renderCalendar();
    scrollToMonth(y, m, false);
  } else {
    curMonth = m;
    document.getElementById('monthYearLabel').textContent = `${curYear}년 ${curMonth + 1}월`;
    scrollToMonth(y, m, true);
  }
});
document.getElementById('nextMonth').addEventListener('click', () => {
  if (viewMode === 'overview') {
    let m = curMonth + 1, y = curYear;
    if (m > 11) { m = 0; y++; }
    curYear = y; curMonth = m;
    document.getElementById('monthYearLabel').textContent = `${curYear}년 ${curMonth + 1}월`;
    if (y !== overviewYear) {
      overviewYear = y;
      renderOverview(overviewYear, m);
      scrollToMini(y, m, false);
    } else {
      scrollToMini(y, m, true);
    }
    return;
  }
  let m = curMonth + 1, y = curYear;
  if (m > 11) { m = 0; y++; }
  if (y !== curYear) {
    curYear = y; curMonth = m;
    renderCalendar();
    scrollToMonth(y, m, false);
  } else {
    curMonth = m;
    document.getElementById('monthYearLabel').textContent = `${curYear}년 ${curMonth + 1}월`;
    scrollToMonth(y, m, true);
  }
});

/* ===== 전체보기 토글 ===== */
document.getElementById('toggleView').addEventListener('click', () => {
  setViewMode(viewMode === 'scroll' ? 'overview' : 'scroll');
});

/* ===== 월 선택 팝업 ===== */
let pickerYear = curYear;

function renderPickerGrid() {
  document.getElementById('pickerYearLabel').textContent = `${pickerYear}년`;
  const grid = document.getElementById('pickerGrid');
  grid.innerHTML = '';
  for (let m = 0; m < 12; m++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = `${m + 1}월`;
    if (pickerYear === curYear && m === curMonth) btn.classList.add('active');
    btn.addEventListener('click', () => {
      document.getElementById('pickerBg').classList.remove('show');
      selectMonth(pickerYear, m, false);
    });
    grid.appendChild(btn);
  }
}

document.getElementById('monthYearLabel').addEventListener('click', () => {
  pickerYear = curYear;
  renderPickerGrid();
  document.getElementById('pickerBg').classList.add('show');
});
document.getElementById('pickerPrevYear').addEventListener('click', () => {
  pickerYear--; renderPickerGrid();
});
document.getElementById('pickerNextYear').addEventListener('click', () => {
  pickerYear++; renderPickerGrid();
});
document.getElementById('pickerClose').addEventListener('click', () => {
  document.getElementById('pickerBg').classList.remove('show');
});
document.getElementById('pickerBg').addEventListener('click', (e) => {
  if (e.target.id === 'pickerBg') e.target.classList.remove('show');
});

/* ESC 키로 열려있는 팝업 닫기 */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  ['modalBg', 'manageBg', 'pickerBg', 'imgLightbox', 'searchBg', 'itemBg', 'quickAddBg'].forEach((id) => {
    document.getElementById(id).classList.remove('show');
  });
});

/* ===== 계정 전환 ===== */
function updateAccountButtons() {
  document.querySelectorAll('.acc-card').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.acc === currentAccount);
  });
}
function switchAccount(acc) {
  if (acc === currentAccount) return;
  currentAccount = acc;
  localStorage.setItem(ACTIVE_ACCOUNT_KEY, acc);
  pushToCloud();
  memos = loadMemosFor(acc);
  updateAccountButtons();
  document.getElementById('modalBg').classList.remove('show');
  updateDdayWidget();
  renderSelectedAgenda();
  renderCalendar();
  if (viewMode === 'overview') {
    renderOverview(overviewYear, curMonth);
  }
  scrollToMonth(curYear, curMonth, false);
}
document.querySelectorAll('.acc-card').forEach((btn) => {
  btn.addEventListener('click', () => switchAccount(btn.dataset.acc));
});
updateAccountButtons();

/* PC 화면에서 실제 남는 세로 공간을 측정해 달력 칸 높이를 계산
   (모니터 해상도/브라우저 창 크기가 달라져도 항상 빈 여백 없이 꽉 차게) */
function updateRowHeight() {
  if (window.innerWidth < 1100) {
    document.documentElement.style.removeProperty('--row-h');
    return;
  }
  const main = document.querySelector('main');
  const mainTop = main.getBoundingClientRect().top;
  const mainPaddingBottom = parseFloat(getComputedStyle(main).paddingBottom) || 0;
  const available = window.innerHeight - mainTop - mainPaddingBottom;
  const overhead = 110; // 월 제목 + 요일 줄 + 카드 안쪽 여백
  const rowH = Math.max(100, (available - overhead) / 6);
  document.documentElement.style.setProperty('--row-h', rowH + 'px');
}
window.addEventListener('resize', updateRowHeight);
updateRowHeight();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(updateRowHeight);
}

/* 메모 패널을 제목박스 바로 아래에 정확히 붙임 */
function updateMemoPanelPosition() {
  const panel = document.getElementById('memoPanel');
  if (window.innerWidth >= 1100) {
    const header = document.querySelector('header');
    const top = header.getBoundingClientRect().bottom + 10;
    panel.style.top = top + 'px';
  } else {
    panel.style.top = '';
  }
}
window.addEventListener('resize', updateMemoPanelPosition);
updateMemoPanelPosition();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(updateMemoPanelPosition);
}

document.getElementById('imgLightbox').addEventListener('click', () => {
  document.getElementById('imgLightbox').classList.remove('show');
});

/* ===== 오늘의 일정 (좌측 패널, 달력을 클릭하지 않아도 오늘 등록된 내용을 바로 확인) ===== */
function renderAgendaInto(dateKey, boxId, emptyText) {
  const box = document.getElementById(boxId);
  const items = memos[dateKey] || [];
  box.innerHTML = '';
  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-memo';
    empty.textContent = emptyText;
    box.appendChild(empty);
    return;
  }
  items.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'agenda-item';
    if (it.isTodo) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!it.done;
      cb.addEventListener('change', () => {
        toggleMemoTodoDone(dateKey, idx, cb.checked);
        renderAgendaInto(dateKey, boxId, emptyText);
      });
      row.appendChild(cb);
    }
    const txt = document.createElement('span');
    txt.className = 'agenda-item-text';
    txt.textContent = (it.image ? '📷 ' : '') + (it.alarmTime ? '⏰ ' + it.alarmTime + ' ' : '') + (it.isDday && it.ddayTarget ? '[' + computeDdayLabel(it.ddayTarget) + '] ' : '') + it.text;
    if (it.isTodo && it.done) txt.classList.add('todo-done-preview');
    if (it.color) txt.style.color = it.color;
    row.appendChild(txt);
    row.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT') return;
      openItemPopup(dateKey, idx, row);
    });
    box.appendChild(row);
  });
}

let selectedDateKey = null;

function renderSelectedAgenda() {
  const todayKey = keyOf(today.getFullYear(), today.getMonth(), today.getDate());
  const key = selectedDateKey || todayKey;
  const title = document.querySelector('#memoPanel .memo-panel-title');
  if (key === todayKey) {
    title.textContent = '📋 오늘의 일정';
  } else {
    const [y, m, d] = key.split('-').map(Number);
    title.textContent = `📋 ${m}월 ${d}일의 일정`;
  }
  renderAgendaInto(key, 'todayAgenda', '등록된 일정이 없어요.');
}

function renderTomorrowAgenda() {
  const t = new Date(today);
  t.setDate(t.getDate() + 1);
  const tomorrowKey = keyOf(t.getFullYear(), t.getMonth(), t.getDate());
  renderAgendaInto(tomorrowKey, 'tomorrowAgenda', '내일 등록된 일정이 없어요.');
}

function selectDate(dateKey) {
  selectedDateKey = dateKey;
  renderSelectedAgenda();
}

/* ===== 알람 체크 (탭이 열려있는 동안, 30초마다 오늘 날짜의 알람 시간을 확인) ===== */
const alarmQueue = [];
let alarmShowing = false;

function playAlarmBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.3, 0.6].forEach((delay) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.2);
    });
  } catch (e) { /* 소리 재생 불가 시 무시 */ }
}

function showNextAlarm() {
  if (alarmShowing || alarmQueue.length === 0) return;
  alarmShowing = true;
  const { dateKey, timeStr, text } = alarmQueue.shift();
  document.getElementById('alarmOverlayTime').textContent = formatShortDate(dateKey) + ' ' + timeStr;
  document.getElementById('alarmOverlayText').textContent = text;
  document.getElementById('alarmOverlay').classList.add('show');
  playAlarmBeep();
}
document.getElementById('alarmOverlayClose').addEventListener('click', () => {
  document.getElementById('alarmOverlay').classList.remove('show');
  alarmShowing = false;
  showNextAlarm();
});

function checkAlarms() {
  const now = new Date();
  const k = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
  const items = memos[k];
  if (!items || items.length === 0) return;
  const nowHM = pad(now.getHours()) + ':' + pad(now.getMinutes());
  let changed = false;
  items.forEach((it) => {
    if (it.alarmTime && !it.alarmFired && it.alarmTime <= nowHM) {
      it.alarmFired = true;
      changed = true;
      alarmQueue.push({ dateKey: k, timeStr: it.alarmTime, text: it.text });
      if (window.Notification && Notification.permission === 'granted') {
        try { new Notification('⏰ ' + it.text, { body: k + ' ' + it.alarmTime }); } catch (e) { /* 무시 */ }
      }
    }
  });
  if (changed) {
    saveMemos();
    renderCalendar();
    showNextAlarm();
  }
}
setInterval(checkAlarms, 30000);
checkAlarms();
updateDdayWidget();

renderCalendar();
scrollToMonth(curYear, curMonth, false);
</script>
