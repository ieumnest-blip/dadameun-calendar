/* ===== 알람 체크 (탭이 열려있는 동안, 30초마다 오늘 날짜의 알람 시간을 확인) ===== */
const alarmQueue = [];
let alarmShowing = false;

function playAlarmBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.3, 0.6].forEach((delay) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.2);
    });
  } catch (e) { /* 소리 재생 불가 시 무시 */ }
}

function showNextAlarm() {
  if (alarmShowing || alarmQueue.length === 0) return;
  alarmShowing = true;
  const { dateKey, timeStr, text } = alarmQueue.shift();
  document.getElementById('alarmOverlayTime').textContent = formatShortDate(dateKey) + ' ' + timeStr;
  document.getElementById('alarmOverlayText').textContent = text;
  document.getElementById('alarmOverlay').classList.add('show');
  playAlarmBeep();
}
document.getElementById('alarmOverlayClose').addEventListener('click', () => {
  document.getElementById('alarmOverlay').classList.remove('show');
  alarmShowing = false;
  showNextAlarm();
});

function checkAlarms() {
  const now = new Date();
  const k = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
  const items = memos[k];
  if (!items || items.length === 0) return;
  const nowHM = pad(now.getHours()) + ':' + pad(now.getMinutes());
  let changed = false;
  items.forEach((it) => {
    if (it.alarmTime && !it.alarmFired && it.alarmTime <= nowHM) {
      it.alarmFired = true;
      changed = true;
      alarmQueue.push({ dateKey: k, timeStr: it.alarmTime, text: it.text });
      if (window.Notification && Notification.permission === 'granted') {
        try { new Notification('⏰ ' + it.text, { body: k + ' ' + it.alarmTime }); } catch (e) { /* 무시 */ }
      }
    }
  });
  if (changed) {
    saveMemos();
    renderCalendar();
    showNextAlarm();
  }
}
setInterval(checkAlarms, 30000);

/* ===== 모바일 뒤로가기: 로그아웃/앱종료 대신 열려있는 창(팝업)만 닫기 =====
   팝업이 열릴 때 히스토리를 하나 쌓아두고, 뒤로가기(popstate)가 오면
   실제 페이지 이동 대신 열려있는 팝업만 닫는다. 팝업이 하나도 없으면
   평소처럼(뒤로가기 = 앱/탭 종료) 동작한다. */
(function setupBackButtonClosesModal() {
  const watchSelectors = [
    '#pickerBg', '#itemBg', '#modalBg', '#manageBg', '#searchBg',
    '#quickAddBg', '#imgLightbox', '#alarmOverlay', '#yearOverview'
  ];
  // 뒤로가기 눌렀을 때 닫을 우선순위(가장 위에 떠 있을 가능성이 높은 것부터)
  const closePriority = [
    '#pickerBg', '#itemBg', '#modalBg', '#manageBg', '#searchBg',
    '#quickAddBg', '#imgLightbox', '#alarmOverlay', '#yearOverview'
  ];

  let pushedDepth = 0;
  let closingFromPop = false;

  function isOpen(el) {
    return !!el && el.classList.contains('show');
  }
  function anyOpen() {
    return watchSelectors.some((sel) => isOpen(document.querySelector(sel)));
  }

  const observer = new MutationObserver((mutations) => {
    mutations.forEach((m) => {
      const el = m.target;
      const nowOpen = el.classList.contains('show');
      const wasOpen = m.oldValue ? (' ' + m.oldValue + ' ').indexOf(' show ') !== -1 : false;
      if (nowOpen && !wasOpen) {
        pushedDepth++;
        history.pushState({ calModalDepth: pushedDepth }, '');
      } else if (!nowOpen && wasOpen) {
        if (closingFromPop) {
          closingFromPop = false;
        } else if (suppressModalHistoryClose) {
          suppressModalHistoryClose = false;
        } else if (pushedDepth > 0) {
          pushedDepth--;
          history.back();
        }
      }
    });
  });

  watchSelectors.forEach((sel) => {
    const el = document.querySelector(sel);
    if (el) observer.observe(el, { attributes: true, attributeFilter: ['class'], attributeOldValue: true });
  });

  window.addEventListener('popstate', () => {
    if (!anyOpen()) return; // 열린 팝업이 없으면 평소처럼 뒤로가기(앱 종료 등) 진행
    closingFromPop = true;
    for (const sel of closePriority) {
      const el = document.querySelector(sel);
      if (isOpen(el)) {
        el.classList.remove('show');
        break;
      }
    }
    if (pushedDepth > 0) pushedDepth--;
  });
})();

/* PWA: 홈 화면에 앱처럼 설치할 수 있게 서비스워커 등록.
   file://로 직접 열었을 때나 서비스워커를 지원 안 하는 환경에서는 조용히 건너뜀. */

  });
}
