<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>다담은 달력 - 처음 설정</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #eef2f5;
    color: #33505f;
  }
  .wrap { padding: 26px 26px 20px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .head svg { width: 46px; height: 46px; }
  .head h1 { font-size: 18px; margin: 0; color: #1f7bb5; }
  p { font-size: 13px; line-height: 1.6; margin: 0 0 10px; }
  .eg { font-size: 12px; color: #7fa3b8; margin-bottom: 14px; }
  input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 11px 12px;
    border: 1px solid #c7d6de;
    border-radius: 10px;
    background: #fff;
  }
  input:focus { outline: 2px solid #8ec6f0; border-color: #3d8fc0; }
  .err { color: #e06565; font-size: 12.5px; min-height: 36px; margin: 8px 0 6px; line-height: 1.45; }
  button {
    width: 100%;
    font-family: inherit;
    background: #3d8fc0;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 0;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 10.2h-1.26A8 8 0 1 0 9 20h9a4.9 4.9 0 0 0 0-9.8z" fill="#ffffff" stroke="#8ec6f0" stroke-width="1.3" stroke-linejoin="round"/>
      <circle cx="10.4" cy="16.1" r="0.7" fill="#5a6b7a"/>
      <circle cx="14.6" cy="16.1" r="0.7" fill="#5a6b7a"/>
      <circle cx="9.1" cy="17.5" r="1.05" fill="#ffb3c0"/>
      <circle cx="15.9" cy="17.5" r="1.05" fill="#ffb3c0"/>
      <path d="M11.7,17.4 q0.8,0.9 1.6,0" stroke="#5a6b7a" stroke-width="0.55" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>다담은, 달력 위젯 설정</h1>
  </div>
  <p>평소에 휴대폰이나 브라우저에서 달력을 열 때 쓰는 <b>깃허브 페이지 주소</b>를 붙여넣어 주세요. 처음 한 번만 하면 돼요.</p>
  <div class="eg">예: https://아이디.github.io/저장소이름/</div>
  <input type="text" id="url" placeholder="https://" autofocus spellcheck="false">
  <div class="err" id="err"></div>
  <button id="save">저장하고 시작하기</button>
</div>
<script>
  const urlEl = document.getElementById('url');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('save');
  window.dadameunDesktop.getUrl().then((u) => { if (u) urlEl.value = u; });
  async function save() {
    errEl.textContent = '';
    btn.disabled = true;
    btn.textContent = '확인하는 중...';
    const res = await window.dadameunDesktop.saveUrl(urlEl.value);
    if (!res || !res.ok) {
      errEl.textContent = (res && res.error) || '문제가 생겼어요. 다시 시도해주세요.';
      btn.disabled = false;
      btn.textContent = '저장하고 시작하기';
    }
  }
  btn.addEventListener('click', save);
  urlEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
</script>
</body>
</html>
